[project]
name = "qa-feels-good"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    # Сюда можно будет добавлять ваши библиотеки, например:
    # "pytest>=8.0.0",
    "pytest (>=9.0.3,<10.0.0)",
    "playwright (>=1.61.0,<2.0.0)",
    "pytest-playwright (>=0.8.0,<0.9.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

# Добавьте этот блок ниже:
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py314']

[tool.flake8]
exclude = [".venv", ".git", "__pycache__"]
max-line-length = 88
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-rich (>=0.2.0,<0.3.0)"
]
