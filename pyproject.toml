[project]
name = "qa-feels-good"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    # Сюда можно будет добавлять ваши библиотеки, например:
    # "pytest>=8.0.0",
    "pytest (>=9.0.3,<10.0.0)",
    "playwright (>=1.61.0,<2.0.0)",
    "pytest-playwright (>=0.8.0,<0.9.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "responses (>=0.26.3,<0.27.0)",
    "isort (>=9.0.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "allure-pytest (>=2.16.1,<3.0.0)",
    "allure-combine (>=1.0.11,<2.0.0)",
    "pytest-html (>=4.2.0,<5.0.0)"
]

# Добавьте этот блок ниже:
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py314']

[tool.flake8]
exclude = [".venv", ".git", "__pycache__"]
max-line-length = 88
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-rich (>=0.2.0,<0.3.0)"
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
